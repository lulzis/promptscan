# Abkürzungen mit Schlusspunkt, nach denen kein Satz endet (regel "satzgrenze").
#
# src/text.rs liest begriff und formen und verbindet zwei Abschnitte nach UAX #29 wieder,
# wenn der erste auf eine dieser Abkürzungen endet («Art. 5 Abs. 2 DSG» bleibt ein Satz).
# Verglichen wird mit Gross- und Kleinschreibung, darum steht jede Schreibung so, wie sie
# in der Quelle steht. Eine klein geschriebene Abkürzung gilt zusätzlich mit grossem
# Anfangsbuchstaben, aber nur am Anfang eines Abschnitts («Vgl. Art. 5 DSG»). Ein
# geschütztes Leerzeichen (U+00A0, U+202F) zählt wie ein gewöhnliches («z. B.»).
# Vor einem Kleinbuchstaben trennt UAX #29 ohnehin nicht (Regel SB8):
# «lit. a», «let. a», «lett. a» brauchen keinen Eintrag.
#
# Quellen:
# - Deutsch: Gesetzestechnische Richtlinien des Bundes (GTR), Stand 5. Juni 2026,
#   Bundeskanzlei; Seitenzahl = Seite des PDF.
# - Französisch und Italienisch: amtlicher Wortlaut auf Fedlex; «cfr.» aus dem Prontuario
#   der Bundeskanzlei zu den Direttive di tecnica legislativa (1° ottobre 2024).
# - Anreden und Titel: Unicode CLDR 49 (Tag release-49, 21.10.2026), Ausnahmen der
#   Satzsegmentierung in common/segments/{de,fr,it}.xml. Für diese Einträge gilt:
