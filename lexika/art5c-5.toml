# Art. 5 Bst. c Ziff. 5 DSG: Daten über verwaltungs- und strafrechtliche Verfolgungen
# oder Sanktionen.
#
# Verwaltungsrechtliche Verfolgungen und Sanktionen nur mit Beleg: Disziplinarverfahren
# und Führerausweisentzüge nennt die Botschaft zum DSG ausdrücklich (BBl 1988 II 413,
# 446); die Wortlaute stammen aus BGFA und SVG.
#
# Bewusst weggelassen (siehe RegelInfo::grenzen): «Busse» allein (auch Mehrzahl von
# «Bus»), FR «amende» allein (auch: «il amende» = ändert ab), «beschuldigt» allein,
# «verurteilt» (auch Zivilurteile), «condamné»/«condannato» ohne «pour»/«per», FR «prévenu» ohne Artikel
# (Partizip von «prévenir»), FR «expulsion», FR «dénonciation» und IT «denuncia» allein
# (auch Kündigung eines Vertrags, IT auch «denuncia dei redditi»), FR «plainte» allein
# (auch Reklamation), FR «retrait du permis» ohne «de conduire» (auch Bau- oder
# Aufenthaltsbewilligung), IT «denunciato» und «indagato», IT «arresto» (auch «arresto
# cardiaco»), IT «espulsione».
#
# «dénonciation» und «denuncia» zählen nur in eindeutigen Wendungen («dénonciation
# pénale», «dénoncé une infraction», «sporto denuncia»), FR «plainte» nur in «plainte
# pénale», «porter plainte» und «déposer plainte».
#
# «vorbestraft» nach Duden: Das Alltagswort steht in keinem der durchsuchten Erlasse
# (StPO, StGB, StReG und weitere); die StPO schreibt «Vorstrafen» (Art. 195 Abs. 2).
#
# FR «procédure pénale» zählt; die Titel «Code de procédure pénale», «Procédure pénale
# applicable aux mineurs» und «Procédure pénale militaire» sind als Ausnahme eingetragen
# und melden nichts. Den letzten trifft nur die gross geschriebene Form: die PPM selbst
# schreibt «l'ouverture d'une procédure pénale militaire» für ein Verfahren.
#
# Die Beschwerde nach SchKG und ZGB («plainte à l'autorité de surveillance», «plainte
# auprès de l'autorité de surveillance») ist als Ausnahme eingetragen; sie gewinnt vor
# «porté plainte» und «déposé plainte».

