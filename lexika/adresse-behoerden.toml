# Regel «adresse»: Bezeichnungen von Behörden für die Ausnahme der Behördenadresse.
#
# Anonymisierungsregeln des Bundesgerichts, Art. 7 Abs. 3: «Die Adressen von Parteien,
# Verfahrensbeteiligten und Rechtsvertretern werden in jedem Fall weggestrichen, auch wenn
# die Namen offen gelegt werden. Vorbehalten sind die Adressen von Behörden.» Steht eines
# dieser Wörter am Anfang oder am Ende des Abschnitts unmittelbar vor der Adresse
# («Bezirksgericht Zürich, …»), gilt die Adresse als Behördenadresse und wird nicht gemeldet.
#
# Deutsch schreibt Behörden zusammen («Bezirksgericht», «Steueramt»): darum `teilwort = "ende"`.
# Jedes Wort steht wörtlich in der zitierten Stelle der jeweiligen Sprachfassung.

