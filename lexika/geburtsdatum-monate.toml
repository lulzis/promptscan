# Monatsnamen für die Regel «geburtsdatum» (SPEC 5.2). merkmal = Monatsnummer 1 bis 12.
#
# Deutsch: Schreibweisungen der Bundeskanzlei, Rz. 527 und 528 (ausgeschriebene Namen und
# Abkürzungen); dazu «Feb.» und «Apr.» aus CLDR de-CH. Französisch und Italienisch: Unicode
# CLDR 49 (cldr-json 49.0.0, cldr-dates-full/main/<locale>/ca-gregorian.json), Kalender
# gregorian, months/format, Breiten wide und abbreviated, Locales fr-CH und it-CH. Steht eine
# Abkürzung gleich wie der ausgeschriebene Name (mars, mai, juin, août), ist sie nur einmal
# aufgenommen. Dazu «fév.», wie Fedlex es in Fussnoten schreibt.
#
# Die Regel lässt nach einer Form ohne Schlusspunkt einen Punkt zu: CLDR schreibt it-CH «gen»,
# Fedlex in Fussnoten «gen.», «mag.», «feb.» (z. B. SR 221.411 Anhang 2, italienische Fassung).
