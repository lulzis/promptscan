# Vertretungsmerkmale (Regel name, SPEC 5.2, Ausnahme nach Art. 4 Abs. 1 lit. g der
# Anonymisierungsregeln des Bundesgerichts: «die Namen der Rechtsvertreter der Parteien»).
#
# Ein Anwaltswort aus name-rechtsvertretung.toml mit merkmal «anwalt», «anwalt-de» oder
# «anwalt-wort» («Me», «avv.», «Rechtsanwältin», «avocat») nimmt einen Namen nur aus, wenn
# der Satz die Person als Vertretung einer Partei zeigt. Diese Liste nennt die Wörter, an
# denen promptscan das erkennt. Sie markiert selbst nichts und wird nur neben einem
# Anwaltswort gelesen; «Mon patient, Me Laurent Dupont, souffre …» meldet den Namen.
# «conseil» (merkmal beratung) zeigt die Vertretung nur mit «vertreten» oder einer Partei,
# «mandataire» (merkmal beauftragt) nur mit «partie» oder einer Verfahrensrolle danach.
#
# merkmal:
#   vertreten  Partizip mit Präposition unmittelbar vor dem Anwaltswort, auch vor einer
#              Anrede, einem Artikel oder einem Possessivpronomen davor: «vertreten durch RA
#              …», «représentée par Me …», «rappresentato dall'avv. …», «vertreten durch Frau
#              Rechtsanwältin …», «assistée de son conseil». Ebenso vor einem Namen, dem das
#              Anwaltswort mit Komma folgt: «vertreten durch Hans Muster, Rechtsanwalt».
#   vertritt   Verb unmittelbar nach dem Namen, den ein Anwaltswort einleitet, oder nach dem
#              Anwaltswort selbst, und nach dem Verb eine Partei: «Rechtsanwältin … vertritt
#              die Klägerin», «Me … plaide pour la recourante», «Hans Muster, Rechtsanwalt,
#              vertritt Erika Beispiel». Im übertragenen Gebrauch folgt keine Partei
#              («vertritt die Auffassung», «représente un danger»): Der Name wird gemeldet.
#   besitz     Possessivpronomen unmittelbar vor dem Anwaltswort: «Ihr Anwalt», «mon avocat»,
#              «il suo avvocato». Es zeigt die Vertretung nur, wenn der Satz keine Angabe
#              nach Art. 5 lit. c DSG enthält; sonst ist die Person selbst betroffen, und der
#              Name wird gemeldet: «Mon avocat, Me Jean Dupont, est en incapacité de
#              travail.», «Jean Dupont, son avocat, est en incapacité de travail.». Nach dem
#              Anwaltswort verbindet es ihn mit der Partei («Anwalt meiner Mandantin»).
#   bezug      Präposition oder Artikel, klein geschrieben, nach dem Anwaltswort, höchstens
#              zwei, vor einer Partei: «Anwalt von Hans Muster», «avocat de la partie
#              adverse», «avvocato della controparte»; die Artikel auch vor einem
#              Possessivpronomen: «Mario Rossi, il suo avvocato».
#   partei     Partei nach «bezug». Ebenso zählen eine Verfahrensrolle (verfahrensrollen.toml),
#              eine Anrede, ein Vorname aus dem BFS-Register mit Nachnamen oder nach einem
#              Possessivpronomen jedes Wort («Anwalt meiner Mandantin»).
#
# Folgt der Bezeichnung der Vertretung ein Name nach Komma oder Doppelpunkt, gilt auch er als
# Vertretung: «votre avocate, Me …», «Avocate de la partie adverse: Me …».
#
# Formen: Flexion (Geschlecht, Zahl) und die mit dem Artikel verschmolzenen Präpositionen
# (it. «dal», «dall'», «dalla» …). Wörterbücher haben keine Fassung; «fassung» ist dort der
# Tag, an dem der Eintrag gelesen wurde.

# --- vertreten: Partizip mit Präposition vor dem Anwaltswort ---

[[eintrag]]
begriff = "vertreten durch"
sprache = "de"
regel = "name"
quelle = "ZV (SR 631.01) Art. 209 Bst. a: «Angabe, dass die Schweizerische Eidgenossenschaft, vertreten durch das BAZG, die Gläubigerin ist;»"
fassung = "2024-10-01"
url = "https://www.fedlex.admin.ch/eli/cc/2007/250/de#art_209"
merkmal = "vertreten"
notiz = "Partizip als Apposition zur Partei, wie im Rubrum: «vertreten durch Rechtsanwältin …». Im Verfahrensrecht steht es nachgestellt, StPO (SR 312.0) Art. 106 Abs. 2: «Eine handlungsunfähige Person wird durch ihre gesetzliche Vertretung vertreten.»; in StPO, ZPO, BGG, VwVG, ZGB, OR, BGFA und SchKG steht die Wendung nicht wörtlich, darum die Zollverordnung."

