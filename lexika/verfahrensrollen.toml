# Verfahrensrollen aus StPO, ZPO und BGG, dazu die substantivischen Rollen aus VwVG, ZGB,
# MStP und VStrR, je Sprache aus dem amtlichen Wortlaut (Regel name, SPEC 5.2).
#
# Folgt auf die Rolle ein Name, wird er erkannt («Zeuge Meier», «le prévenu Dupont»). Weil
# das Deutsche jedes Substantiv gross schreibt, zählt danach nur ein Vorname oder ein
# Nachname aus dem BFS-Register, der nicht zugleich ein gewöhnliches Wort ist, auch nach
# Initialen («der Beschwerdeführer A. Meier»). Folgt kein Name, meldet die Regel einen
# Personenbezug (Regel «personenbezug», Art Personenbezug): «die beschuldigte Person»,
# «der Beschwerdeführer», «la partie plaignante», «il ricorrente».
#
# Fassungen: StPO (SR 312.0) 01.04.2025, ZPO (SR 272) 01.07.2026, BGG (SR 173.110)
# 01.04.2026, VwVG (SR 172.021) 01.07.2022, ZGB (SR 210) 01.07.2026, MStP (SR 322.1)
# 01.07.2024, VStrR (SR 313.0) 01.09.2023, abgerufen von Fedlex am 06.11.2026. Formen:
# Flexion (Fall, Zahl, Geschlecht); die weiblichen Formen der substantivischen Rollen stehen
# nicht im Wortlaut dieser Erlasse, die das generische Maskulinum verwenden.
#
# merkmal = "rolle" für alle Einträge.

