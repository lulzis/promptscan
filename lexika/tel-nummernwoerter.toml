# Nummernwörter vor einem Block aus zehn Ziffern (Regel tel, SPEC 5.1, Befund technik-4,
# Entscheid C3).
#
# Eine Kunden-, Rechnungs-, Policen- oder Patientennummer kann aussehen wie eine
# Telefonnummer ohne Trenner: 0, eine Kennzahl aus Festnetz oder Mobilnetz und sieben
# Ziffern («Rechnung 0791234567»). Steht ein Wort dieser Liste unmittelbar vor einem Block
# aus zehn Ziffern, meldet tel den Block nicht. Dazwischen dürfen nur Leerzeichen, ein
# Doppelpunkt und «Nr.», «No.», «n°», «n.» oder «#» stehen (klasse_a.rs, nummernwort_davor).
# Gruppiert geschriebene Nummern («079 123 45 67») und Nummern mit +41 oder 0041 meldet tel
# auch nach diesen Wörtern.
#
# Die Wortliste markiert selbst keine Stelle. Zusammensetzungen mit «Nummer» und ihre
# Kürzel («Kunden-Nr.») stehen als Formen beim Grundwort, wenn das Wörterbuch sie nicht als
# eigenes Stichwort führt; das sagt dann die Notiz. Fassung bei Wörterbüchern = Abrufdatum.
#
# Ein blosses Wort ohne «Nummer» und ohne Kürzel danach («Rechnung», «Auftrag», «facture»,
# «fattura») nennt nach einer Präposition nur das Thema: «Bei Fragen zur Rechnung
# 0791234567 anrufen», «Pour toute question sur la facture: 0791234567». Dann meldet tel
# den Block (Prüferproblem c-erkennung-p5). Als Präposition zählen nur die Einträge mit
# merkmal «praeposition» am Ende dieser Datei («zur», «zum», «sur», «sulla»), zwischen
# Präposition und Wort wahlweise ein bestimmter Begleiter aus firma-grenzen.toml («sur la
# facture»). «für», «gemäss» und «auf» nicht: «für Rechnung 0791234567» ist die Nummer
# der Rechnung.
#
# merkmal:
#   (keines)      Nummernwort.
#   praeposition  Präposition, auch mit Artikel verschmolzen, die das Thema einleitet.

