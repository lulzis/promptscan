# Art. 5 Bst. c Ziff. 2 DSG: Daten über die Gesundheit, die Intimsphäre oder die
# Zugehörigkeit zu einer Rasse oder Ethnie.
#
# Jeder Begriff steht wörtlich in der genannten Stelle (Gross-/Kleinschreibung
# ausgenommen). Steht dort nur eine gebeugte Form, ist diese der Begriff.
#
# Merkmal «icd»: Der Begriff wird gemeldet UND löst die Suche nach ICD-10-Kodes aus
# («Diagnose: F32.1»). Merkmal «icd-nur»: Der Begriff löst nur die Suche aus und wird
# selbst nicht gemeldet («ICD-10: F32.1»).
#
# Merkmal «ausnahme»: Der längere Treffer gewinnt und meldet nichts
# («assurance-maladie» ist eine Versicherung, keine Krankheit). Eingetragen sind nur
# Namen mit Fundstelle; für «assurance perte de gain maladie» fand sich keine, dort
# zählt «maladie».
#
# Merkmal «name»: FR «cancer» ist auch Nachname. Der Eintrag zählt nicht, wenn er in
# einem Namen liegt, den die Regel «name» erkennt («M. Paul Cancer»).
#
# Merkmal «dauer»: Der Treffer zählt nur, wenn eine Dauer in Monaten oder Wochen folgt
# («enceinte de huit mois»); die Dauer gehört dann zur gemeldeten Stelle.
#
# Bewusst weggelassen (die Gründe nennt RegelInfo::grenzen in src/regeln/art5c.rs):
# «Rasse»/«race»/«razza» allein (Tierrassen), FR «invalidité» und IT «invalidità»
# (auch: Ungültigkeit), DE «invalid», «Behinderte» (auch: Partizip von «behindern»),
# «Behinderung» allein (auch: Hindernis), «Unfall» (auch blosser Sachschaden),
# «Mutterschaft» (Familienstand, nicht notwendig eine Gesundheitsangabe), FR «enceinte»
# allein (auch: Umfassung, Lautsprecher), IT «parto» (auch: «ich reise ab»), DE «Krebs»
# allein (auch Familienname und Tier), FR «arrêt de travail» (auch Arbeitsniederlegung),
# DE «Abhängigkeit», FR «dépendance» und IT «dipendenza» allein (auch wirtschaftliche
# Abhängigkeit, FR auch Nebengebäude), FR «appartenance ethnique» (die Botschaft
# FF 2017 6640 schreibt nur «origine ethnique»; keine wörtliche Fundstelle gefunden).
#
# Wörterbuch oder Bundesamt statt Erlass: «krankgeschrieben», «Burn-out»/«burn out»,
# FR «être enceinte»/«enceinte de» (Duden, Larousse) sowie «Suizid», «Depression» und
# ihre Gegenstücke (BAG/OFSP/UFSP). Diese Wörter stehen in keinem der durchsuchten Erlasse.

