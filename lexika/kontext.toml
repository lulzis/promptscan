# --- StBOG und CPP, Italienisch: Strafverfolgung ---------------------------------------

[[eintrag]]
begriff = "procuratore pubblico"
formen = ["procuratrice pubblica", "procuratori pubblici", "procuratrici pubbliche"]
sprache = "it"
regel = "kontext"
merkmal = "criminal-authority"
quelle = "SR 173.71 Art. 14 lit. a"
fassung = "2024-01-01"
url = "https://www.fedlex.admin.ch/eli/cc/2010/444/it#art_14"
notiz = "«se sono emanati da un procuratore pubblico» (LOAP); im Tessin der Titel der kantonalen Staatsanwältinnen und Staatsanwälte. Strafverfolgungsbehörde (Art. 12 lett. b CPP): Art. 320 n. 1 CP und Art. 73 cpv. 1 CPP."

[[eintrag]]
begriff = "procuratore generale"
formen = ["procuratrice generale", "procuratori generali"]
sprache = "it"
regel = "kontext"
merkmal = "criminal-authority"
quelle = "SR 173.71 Art. 9 Abs. 1"
fassung = "2024-01-01"
url = "https://www.fedlex.admin.ch/eli/cc/2010/444/it#art_9"
notiz = "«Il procuratore generale dirige il Ministero pubblico della Confederazione.» (LOAP); DE «Bundesanwalt». Strafverfolgungsbehörde wie «procuratore pubblico». Im Privatrecht ist der «procuratore» der Prokurist (Art. 458 cpv. 1 CO, Fassung 1.10.2026: «Procuratore è colui, che dal proprietario (principale) di un negozio, di una fabbrica, o di altro stabilimento commerciale, viene espressamente o col fatto autorizzato ad esercitare per esso il commercio e a firmare «per procura».») und die «procura generale» eine Generalvollmacht (Art. 535 cpv. 3 CO: «per conferire una procura generale»). Mit «di …» danach zählt der Eintrag darum nicht, ausser vor «Confederazione», «Cantone», «Canton», «Repubblica» oder «Ministero» (Code: VOLLMACHT_IT, AMT_IT)."

[[eintrag]]
begriff = "pubblico ministero"
formen = ["pubblici ministeri"]
sprache = "it"
regel = "kontext"
merkmal = "criminal-authority"
quelle = "SR 312.0 Art. 16 Abs. 1"
fassung = "2025-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2010/267/it#art_16"
notiz = "«Il pubblico ministero è responsabile dell’esercizio uniforme della pretesa punitiva dello Stato.» Die Behörde und, im Sprachgebrauch, die einzelne Staatsanwältin («In qualità di pubblico ministero»). Strafverfolgungsbehörde (Art. 12 lett. b CPP)."

# --- Art. 2 cpv. 1 LIsFi, Italienisch --------------------------------------------------

[[eintrag]]
begriff = "gestore patrimoniale"
formen = ["gestori patrimoniali"]
sprache = "it"
