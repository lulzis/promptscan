# Berufsbezeichnungen von Geheimnisträgerinnen und Geheimnisträgern (Regel «kontext»).
#
# Ein Eintrag zählt nur in einer Selbstbezeichnung der ersten Person: «ich bin Ärztin»,
# «Als Anwältin habe ich», «en tant qu'avocat, je», «sono avvocato» (Rahmen in
# src/regeln/kontext.rs). Mit Possessivbegleiter («mein Anwalt») ist die schreibende Person
# Klientin oder Patientin; das ergibt nur einen Personenbezug (Regel «personenbezug»).
#
# merkmal: Rolle wie bei --role. merkmal = "none" sperrt eine Zusammensetzung, die keine
# Geheimnisträgerin bezeichnet («Tierarzt» gegen die Endung «-arzt»): Bei Überlappung gewinnt
# der längere Eintrag. formen: Genus und Numerus im Nominativ. Genitiv und Dativ Mehrzahl
# fehlen absichtlich («Ich bin Ärzten dankbar» ist keine Selbstbezeichnung).
# teilwort = "ende": Der Eintrag zählt auch als Ende eines zusammengesetzten Worts
# («Hausärztin», «Oberarzt»); die Selbstbezeichnung umfasst dann das ganze Wort.
# FR «contrôleur» (Revisoren) steht in Art. 321 Ziff. 1 CP, bezeichnet allein aber auch
# Kontrolleure aller Art («contrôleur de gestion»); Präzision zu messen (SPEC 4.3). Ebenso
# bezeichnen «Revisor», «réviseur» und «revisore» auch, wer Texte oder Druckbogen prüft
# (Notizen der Einträge).
# Private Stellung statt Pflicht (Code in src/regeln/kontext.rs, fn privat): Ein
# Finanzinstitut vor «meiner», «de ma», «di mia» usw. zählt nicht (Art. 2 Abs. 2 lit. a
# FINIG), «procuratore generale di …» nur vor dem Amt (Art. 458 Abs. 1, Art. 535 Abs. 3 OR).
#
# begriff ist die Grundform. Die Fundstelle nennt das Wort oft nur in einer Form aus
# formen, meist der Mehrzahl (Art. 321 Ziff. 1 StGB: «Rechtsanwälte», «avocats», «avvocati»).
# Gelesen am 06.11.2026 auf Fedlex (fedlex.data.admin.ch), geltende Fassung; jeder Eintrag
# am Wortlaut des zitierten Artikels nachgeprüft (Grundform oder eine Form aus formen).
# Wörter, die kein Bundeserlass braucht, belegen Duden online und Treccani (abgerufen am
# 06.11.2026), wie «Mandant» in personenbezug.toml.

