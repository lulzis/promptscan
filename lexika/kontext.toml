merkmal = "financial-institution"
quelle = "SR 954.1 Art. 2 Abs. 1 lit. a"
fassung = "2026-10-01"
url = "https://www.fedlex.admin.ch/eli/cc/2018/801/it#art_2"
notiz = "«Per istituti finanziari ai sensi della presente legge si intendono, a prescindere dalla loro forma giuridica: a. i gestori patrimoniali (art. 17 cpv. 1)». Nach cpv. 2 nicht unterstellt sind unter anderem «a. le persone che gestiscono esclusivamente valori patrimoniali di persone con cui hanno legami economici o familiari», «d. le persone che gestiscono patrimoni nell’ambito di un mandato disciplinato dalla legge» und «j. le banche ai sensi della legge dell’8 novembre 1934 sulle banche (LBCR)». Erkannt wird nur lit. a an «di» mit Possessiv der ersten Person («gestore patrimoniale di mia madre» zählt nicht); für Angestellte einer Bank gilt Art. 47 LBCR (--role bank)."

