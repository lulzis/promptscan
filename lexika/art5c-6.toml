# Art. 5 Bst. c Ziff. 6 DSG: Daten über Massnahmen der sozialen Hilfe.
#
# Nur Eindeutiges: Massnahmen des Kindes- und Erwachsenenschutzes (ZGB) und die
# Sozialhilfe. Die Botschaft zum DSG nennt «Sozialversicherungsleistungen im
# Zusammenhang mit Krankheit und Unfall sowie Vormundschafts- und Fürsorgemassnahmen»
# (BBl 1988 II 413, 446). Leistungen der Sozialversicherungen fehlen hier bewusst
# (Abgrenzung in RegelInfo::grenzen); Krankheit, Invalidität und IV-Rente meldet
# art5c-2 als Gesundheitsdaten («Unfall» fehlt auch dort). Nicht erfasst sind ferner
# Behörden und kantonale Bezeichnungen wie «Sozialamt», «KESB», «wirtschaftliche Hilfe».
#
# Bewusst weggelassen: «Beistand» allein («Beistand leisten»), «Nothilfe»,
# «aide d'urgence», «soccorso d'emergenza» (auch: Erste Hilfe, Rettung),
# «Unterstützung», «bedürftig», «bevormundet» (auch übertragen: «sich bevormundet
# fühlen»), IT «curatore» (auch: Kurator, «curatore fallimentare»), FR «tuteur» und
# «tutelle» sowie IT «tutore» und «tutela» allein (auch: Nachhilfelehrer,
# Pflanzenstütze, «tutela dei dati»). Diese zählen nur in Wendungen mit dem Kind oder
# der Behörde aus Art. 327a und 327b ZGB.

