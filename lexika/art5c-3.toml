# Art. 5 Bst. c Ziff. 3 DSG: genetische Daten.
#
# Das DNA-Profil gehört hierher: «Genetische Daten sind Informationen über das Erbgut
# einer Person, die durch eine genetische Untersuchung gewonnen werden; darin
# eingeschlossen ist auch das DNA-Profil» (Botschaft DSG, BBl 2017 6941, 7020).
#
# Merkmal «ausnahme»: Der Eintrag gewinnt als längerer Treffer und meldet nichts
# («DNA-Profil-Gesetz» ist der Name eines Erlasses, kein DNA-Profil).

