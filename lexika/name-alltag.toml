# Wörter, die das BFS-Register auch als Nachnamen führt (Regel name, SPEC 5.2). Die Liste
# markiert selbst nichts; promptscan liest sie nur dort, wo ein solches Wort als Nachname in
# Frage kommt.
#
# merkmal:
#   satzwort  Wort, das einen Satz beginnen kann (Adverb, Konjunktion, Pronomen, Artikel,
#             Präposition). Eine Initiale mit Punkt kann den Satz beenden; darum gilt das Wort
#             nach Initialen in der Sprache des Auslösers nicht als Nachname: «Frau A. Auch
#             …», «le recourant A. Le Tribunal …», «il ricorrente A. Egli …». Nach einem
#             Auslöser einer anderen Sprache zählt es («Frau A. Egli»), ebenso als Teil eines
#             Nachnamens aus mehreren Wörtern («Mme A. Le Coultre», «il ricorrente A. Di
#             Stefano»).
#   alltag    Grussformel, Wochentag oder Alltagswort. In einer Liste gilt es als mehrdeutiger
#             Nachname: In einer Zelle bilden «Liebe Anna», «Montag Peter», «Bonjour Pierre»
#             oder «Glück Anna» kein Paar aus Nachname und Vorname; in Versalien oder über zwei
#             Zellen schon («BONJOUR Pierre», «Bonjour;Pierre»).
#
# Quelle: eine Stelle in einem Erlass der Sprache des Wortes; nur wo keine gefunden wurde,
# ein Wörterbuch (Duden, Larousse, Treccani). Wörterbücher haben keine Fassung; «fassung» ist
# dort der Tag, an dem der Eintrag gelesen wurde.

