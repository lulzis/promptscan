# Begleiter vor einer deutschen Anrede (Regel name, SPEC 5.2, Gegenprobe).
#
# «Frau» und «Herr» sind auch gewöhnliche Substantive. Steht ein Artikel oder ein
# Possessivpronomen davor («Er hat der Frau Angst gemacht», «seine Frau»), ist «Frau»
# meist das Substantiv. Dann zählt danach nur ein Nachname, der nicht zugleich ein
# gewöhnliches Wort ist (Spalte «gesetz» im Register leer), oder ein Vorname.
#
# Die Formen sind die Flexion des jeweiligen Wortes.
#
# merkmal = "begleiter" für alle Einträge.

[[eintrag]]
begriff = "der"
formen = ["die", "das", "des", "dem", "den"]
sprache = "de"
regel = "name"
quelle = "Duden online, «der, die, das»: bestimmter Artikel; Beispiele «auf Befehl des Königs», «auf dem Tisch liegen», «den Baum fällen»"
fassung = "2026-11-06"
url = "https://www.duden.de/rechtschreibung/der__die_das_bestimmte_Artikel"
merkmal = "begleiter"

