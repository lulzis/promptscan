# Abgrenzung der Regel «firma»: Wörter, die vor einem Rechtsformzusatz stehen, aber nicht
# zum Firmennamen gehören, und Zusätze mit zweiter Bedeutung.
#
# merkmal:
#   gattung        unbestimmter Begleiter: «eine AG», «jede GmbH» meinen keine bestimmte Firma.
#                  Steht er unmittelbar vor dem Namen, entfällt der Treffer.
#   bestimmt       bestimmter Begleiter («die», «la», «il»): gehört nicht zum Namen.
#   funktionswort  Präposition, Konjunktion, Adverb: am Satzanfang gross geschrieben, gehört
#                  nicht zum Namen («Bei AG und GmbH …»).
#   ort            Präposition vor einem Ortsnamen («in Wohlen AG»); schliesst den Zusatz aus,
#                  wenn er zugleich ein Kantonskürzel ist.
#   behoerde       Behördenwort («Obergericht AG», «Kanton AG»); schliesst das Kantonskürzel aus.
#                  Behörden werden nicht anonymisiert (BGer-Anonymisierungsregeln Art. 4 Abs. 1
#                  lit. a), ebenso Ortsbezeichnungen (lit. e).
#   kantonskuerzel Rechtsformzusatz, der zugleich ein Kantonskürzel ist.
#   homograph      Rechtsformzusatz, der zugleich ein gewöhnliches Nomen ist.
#
# Jeder Begriff steht wörtlich in der zitierten Stelle der Fassung derselben Sprache. Die
# Formen sind Flexionsformen (Genus, Kasus, Numerus) desselben Wortes.

