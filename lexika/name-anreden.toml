# Anreden, Titel und Heiligennamen vor einem Namen (Regel name, SPEC 5.2).
#
# merkmal:
#   anrede-de  Deutsche Anrede. Danach zählt nur ein Name aus dem BFS-Register, weil das
#              Deutsche alle Substantive gross schreibt («der Frau Angst machen»).
#   anrede     Französische und italienische Anrede. Danach genügt ein grossgeschriebenes
#              Wort, denn Substantive schreiben diese Sprachen klein.
#   titel      Titel vor dem Namen, auch in Ketten («Prof. Dr.»). Danach genügt ein
#              grossgeschriebenes Wort.
#   heilig     Heiligenname: der folgende Vorname ist Teil eines Heiligen- oder Ortsnamens
#              («St. Moritz», «San Bernardino»), kein Personenname.
#
# Die Wörterbücher haben keine Fassung; «fassung» ist der Tag, an dem der Eintrag gelesen
# wurde.

# --- Deutsch: Anrede (Duden) ---

[[eintrag]]
begriff = "Herr"
formen = ["Herrn"]
sprache = "de"
regel = "name"
quelle = "Duden online, «Herr»: «titelähnliche, auch als Anrede verwendete Bezeichnung für eine erwachsene Person männlichen Geschlechts»"
fassung = "2026-11-06"
url = "https://www.duden.de/rechtschreibung/Herr"
merkmal = "anrede-de"
notiz = "«Herrn»: Dativ und Akkusativ; Duden nennt dafür die Abkürzung Hrn."

