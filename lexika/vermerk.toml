# Regel «vermerk» (SPEC 5.4): Klassifizierungsvermerk nach Art. 13 ISG.
#
# Die drei Klassifizierungsstufen stehen in Art. 13 Abs. 1–3 ISG (SR 128), je in der
# amtlichen deutschen, französischen und italienischen Fassung. Die Vorsätze leiten einen
# Vermerk ein («Klassifizierung: vertraulich»); sie stammen aus Art. 11 Abs. 2 ISG und aus
# den Sachüberschriften von Art. 18–20 ISV (SR 128.1), z. B. «Klassifizierungsstufe
# «intern» (Art. 13 Abs. 1 ISG)».
#
# merkmal: "stufe-1", "stufe-2", "stufe-3" = Absatz von Art. 13 ISG; "vorsatz" = Wort vor
# der Stufe.
#
# Gelesen am 06.11.2026 im amtlichen Wortlaut (Fedlex): ISG, eli/cc/2022/232, Fassung vom
# 01.10.2025; ISV, eli/cc/2023/735, Fassung vom 01.05.2025; je in allen drei Sprachen.

