# Rechtsvertretung (Regel name, SPEC 5.2, Ausnahme).
#
# Das Bundesgericht anonymisiert «die Namen der Rechtsvertreter der Parteien» nicht
# (Regeln für die Anonymisierung der Urteile, Art. 4 Abs. 1 lit. g). Die Ausnahme hängt an
# der Rolle im Verfahren, nicht am Beruf: Eine Anwältin kann selbst Patientin, Angestellte
# oder Partei sein. Darum mehrere Arten von Wörtern:
#
# merkmal:
#   rechtsvertretung  Das Wort bezeichnet schon die Vertretung einer Partei («Verteidigerin»,
#                     «défenseur», «patrocinatore»). Ein Name unmittelbar danach («Verteidiger
#                     Hans Muster») oder mit Komma oder Klammer davor («Hans Muster,
#                     Rechtsbeistand») wird nicht markiert.
#   anwalt            Französischer oder italienischer Titel («Me», «Maître», «avv.»). Er wirkt
#                     wie ein Titel: Der Name danach wird gemeldet, ausser der Satz zeigt die
#                     Person als Vertretung einer Partei (name-vertretung.toml: «représenté par
#                     Me …», «Me … plaide pour …», «Me …, avocat de la partie adverse»). Danach
#                     genügt ein grossgeschriebenes Wort.
#   anwalt-de         Deutscher Beruf oder Titel («Rechtsanwältin», «RA»). Wie «anwalt»; weil
#                     das Deutsche alle Substantive gross schreibt, zählt danach aber nur ein
#                     Name aus dem BFS-Register, wie nach «Frau».
#   anwalt-wort       Französischer oder italienischer Beruf («avocat», «avvocato»). Kein
#                     Auslöser, denn danach steht oft ein Adjektiv oder ein Fachgebiet («un
#                     avocat Genevois», «un avvocato Penalista»). Mit einem Vertretungsmerkmal
#                     nimmt er den Namen daneben aus wie «anwalt» («Jean Dupont, avocat de la
#                     partie adverse», «rappresentato dall'avvocato Mario Rossi»).
#   beratung          «conseil»: auch Berater («conseil fiscal») und Rat («Un conseil: …»). Kein
#                     Auslöser; Vertretung nur mit einer Partei danach («Me Jean Dupont, conseil
#                     de Marie Dupont») oder einem Partizip der Vertretung davor («assistée de son
#                     conseil»), nicht mit einem Possessivpronomen oder Verb allein.
#   beauftragt        «mandataire»: auch die Vorsorgebeauftragte nach Art. 360 CC. Kein
#                     Auslöser; Vertretung nur mit «partie» oder einer Verfahrensrolle danach
#                     («le mandataire de la partie, Jean Dupont»).
#
# Die Wörterbücher haben keine Fassung; «fassung» ist der Tag, an dem der Eintrag gelesen
# wurde.

# --- Grundlage der Ausnahme ---

[[eintrag]]
begriff = "Rechtsvertreter"
sprache = "de"
regel = "name"
quelle = "Bundesgericht, Regeln für die Anonymisierung der Urteile, Art. 4 Abs. 1 lit. g: «die Namen der Rechtsvertreter der Parteien»; Abs. 3: «Rechtsvertreter werden in der Regel auch dann nicht anonymisiert …»"
fassung = "2020-02-13"
url = "https://www.bger.ch/home/juridiction/jurisdiction-recht/anonymisierungsregeln.html"
merkmal = "rechtsvertretung"
notiz = "Erlassen von der Präsidentenkonferenz am 17.12.2019, genehmigt von der Verwaltungskommission am 13.02.2020; gelesen am 06.11.2026."

