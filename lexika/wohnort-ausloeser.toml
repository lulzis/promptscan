# Regel «wohnort»: Wörter, nach denen der Wohnort einer Person steht.
#
# Ohne Merkmal folgt die Präposition (de «in», fr «à», it «a» oder «in») und dann eine
# politische Gemeinde aus dem amtlichen Gemeindeverzeichnis. Mit `merkmal = "doppelpunkt"`
# ist das Wort eine Feldbezeichnung («Wohnsitz: Bern») und es folgt ein Doppelpunkt.
# Eine Gemeinde ohne eines dieser Wörter wird nicht gemeldet (Anonymisierungsregeln des
# Bundesgerichts, Art. 4 Abs. 1 lit. b und e).

[[eintrag]]
begriff = "wohnhaft"
sprache = "de"
regel = "wohnort"
quelle = "SR 661 Art. 4a Abs. 2"
fassung = "2024-01-01"
url = "https://www.fedlex.admin.ch/eli/cc/1959/2035_2097_2125/de#art_4_a"
notiz = "«War der Wehrpflichtige schon früher im Ausland wohnhaft, …»"

