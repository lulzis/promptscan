fassung = "2026-01-01"
url = "https://www.fedlex.admin.ch/eli/cc/1988/1776_1776_1776/de#art_37"
notiz = "«Der Name einer Person mit Wohnsitz in der Schweiz untersteht schweizerischem Recht»"

[[eintrag]]
begriff = "Wohnsitz"
