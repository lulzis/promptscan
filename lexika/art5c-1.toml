gross = true
merkmal = "name"
notiz = "Alltagswort ohne Fundstelle in den durchsuchten Erlassen und auf den BFS-Seiten (dort nur «jüdisch»); Duden nach den BK-Schreibweisungen (Rz. 113). Gross geschrieben (Nomen). Gegenstück zu FR «juif» und IT «ebreo». Fassung = Abrufdatum. Merkmal «name»: «Jude» ist auch Vor- und Nachname (BFS-Namensregister); in einem erkannten Namen («Jude Bellingham») zählt es nicht."

