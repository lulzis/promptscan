quelle = "Duden online, «Jude»: «Angehöriger des Judentums als einer kulturellen, ethnischen und/oder religiösen Erfahrungsgemeinschaft, die auf das antike Volk der Israeliten zurückgeht»; Beispiel «europäische, russische Juden»"
