[[eintrag]]
begriff = "sindacato"
formen = ["sindacati"]
sprache = "it"
regel = "art5c-1"
quelle = "SR 0.103.1 Art. 8 Abs. 1 Bst. a: «il diritto di ogni individuo di costituire con altri dei sindacati e di aderire al sindacato di sua scelta…»"
fassung = "2024-11-28"
url = "https://www.fedlex.admin.ch/eli/cc/1993/725_725_725/it#art_8"
notiz = "UNO-Pakt I; Gegenstück zu DE «Gewerkschaft» und FR «syndicat». Nur als ganzes Wort. Gleich lauten die Überprüfung durch ein Gericht («sindacato di legittimità»), der Aktionärsbindungsvertrag («sindacato azionario») und das Partizip von «sindacare»: die Wendungen sind als Ausnahme eingetragen, das Partizip zählt (siehe RegelInfo::grenzen)."

[[eintrag]]
begriff = "sindacale"
formen = ["sindacali"]
sprache = "it"
regel = "art5c-1"
quelle = "SR 0.822.719.9 Art. 1 Ziff. 1: «…tendenti a pregiudicare la libertà sindacale in materia d’impiego.»"
fassung = "2023-08-31"
url = "https://www.fedlex.admin.ch/eli/cc/2001/188/it#art_1"
teilwort = "anfang"
notiz = "Am Wortanfang, damit «sindacalista» und «sindacalismo» mitzählen. «sindacale» heisst auch «des Gemeindepräsidenten» (sindaco): «ordinanza sindacale» und «deliberazione sindacale» sind als Ausnahme eingetragen; «collegio sindacale» (Organ einer Aktiengesellschaft nach italienischem Recht) zählt, weil sich keine Fundstelle fand."

[[eintrag]]
begriff = "sindacato di legittimità"
formen = ["sindacati di legittimità"]
sprache = "it"
regel = "art5c-1"
quelle = "Treccani, Vocabolario, «sindacato¹»: «Nel processo, attività spiegata dal giudice superiore nella revisione dei provvedimenti del giudice inferiore: s. di legittimità; s. di merito; s. di costituzionalità…»"
fassung = "2026-11-06"
url = "https://www.treccani.it/vocabolario/sindacato1/"
merkmal = "ausnahme"
notiz = "Ausnahme: Überprüfung durch ein Gericht, keine Gewerkschaft. Die Wendung steht in keinem durchsuchten Erlass; Treccani kürzt das Stichwort mit «s.» ab. Fassung = Abrufdatum."

