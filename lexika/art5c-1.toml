# Art. 5 Bst. c Ziff. 1 DSG: Daten über religiöse, weltanschauliche, politische oder
# gewerkschaftliche Ansichten oder Tätigkeiten.
#
# Jeder Begriff steht wörtlich in der genannten Stelle (Gross-/Kleinschreibung
# ausgenommen). Steht dort nur eine gebeugte Form, ist diese der Begriff; die übrigen
# Formen sind grammatische Formen (Zahl, Fall, Geschlecht), keine Synonyme.
# Bewusst weggelassen (siehe RegelInfo::grenzen): Parteinamen, «reformiert» allein,
# «konfessionslos» (keine Fundstelle gefunden), FR «confession» allein, FR/IT
# «protestant(e)», Abkürzungen wie «röm.-kath.».
#
# Wörterbuch statt Erlass (Duden, Treccani): «Jude», «Jüdin», «Konfession» und IT
# «ebreo». Diese Alltagswörter stehen in keinem der durchsuchten Erlasse; Duden ist nach
# den Schreibweisungen der BK (Rz. 113) das Rechtschreibwörterbuch der Bundesverwaltung.
#
# FR «syndicat» und IT «sindacato» zählen als ganzes Wort («syndication» nicht). Merkmal
# «ausnahme»: Der Gemeindeverband («syndicat de communes») und die Genossenschaft der
# Güterzusammenlegung («syndicat de remaniement») gewinnen als längerer Treffer und
# melden nichts, ebenso IT die gerichtliche Überprüfung («sindacato di legittimità»,
# «sindacato di merito», «sindacato di costituzionalità»), der Aktionärsbindungsvertrag
# («sindacato azionario», «sindacato di blocco») und was vom Gemeindepräsidenten
# (sindaco) ausgeht («ordinanza sindacale», «deliberazione sindacale»). Diese
# IT-Wendungen stehen in keinem durchsuchten Erlass; Quelle ist Treccani. Für «syndicat
# d'améliorations foncières», «syndicat intercommunal», «collegio sindacale» und «patto
# di sindacato» fand sich keine Fundstelle; sie zählen als Treffer.
#
# Merkmal «name»: «Jude» ist auch Vor- und Nachname («Jude Bellingham»). Der Eintrag
# zählt nicht, wenn er in einem Namen liegt, den die Regel «name» erkennt.

