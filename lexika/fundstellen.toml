# Regel «fundstellen» (SPEC 5.4): Bitte um Urteile, Fundstellen oder Literatur.
#
# Die Substantive stammen aus amtlichen Texten (Fedlex, je im Wortlaut der Sprache) und von
# der Website des Bundesgerichts. Ein Substantiv allein meldet nichts; die Regel verlangt im
# selben Satz eine Aufforderung derselben Sprache (siehe src/regeln/hinweise.rs).
#
# merkmal:
#   "stark"           zählt mit jeder Aufforderung.
#   "schwach"         mehrdeutig; zählt nur in der Mehrzahl oder mit unbestimmtem Artikel.
#   "schwach-gericht" wie "schwach", dazu muss im Satz ein Gericht genannt sein.
#   "quelle"          wie "schwach", aber nicht «Quellen des …rechts» und ohne Fragewort.
#   "gericht"         meldet nie selbst; nennt nur das Gericht für "schwach-gericht".
#
# Bei "schwach", "schwach-gericht" und "quelle" sind alle formen Mehrzahlformen; die Regel
# liest jede Form, die nicht der begriff ist, als Mehrzahl.
#
# Gelesen am 06.11.2026.

