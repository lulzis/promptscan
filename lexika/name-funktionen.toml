# Funktionen und Ämter nach einer Anrede (Regel name, SPEC 5.2, Gegenprobe).
#
# Nach «Frau», «Herr», «Signor» steht oft keine Person, sondern ihre Funktion: «Frau
# Präsidentin», «Herr Minister», «Signor Presidente». Diese Wörter sind kein Name. Steht
# danach ein Name («Frau Präsidentin Muster»), wird er erkannt.
#
# Quellen: die Anwendungsbeispiele des Duden zur Anrede und der Wortlaut des BGG. Die
# Mitglieder von Behörden nennt das Bundesgericht in seinen Anonymisierungsregeln (Art. 5
# Abs. 1). Ihre Namen markiert promptscan trotzdem; ob sie auszunehmen sind, ist offen.
#
# merkmal = "funktion" für alle Einträge.

# --- Deutsch ---

[[eintrag]]
begriff = "Präsident"
formen = ["Präsidentin", "Präsidenten"]
sprache = "de"
regel = "name"
quelle = "BGG (SR 173.110) Art. 14 Abs. 1 lit. a: «den Präsidenten oder die Präsidentin des Bundesgerichts»; Abs. 3: «Der Präsident oder die Präsidentin führt den Vorsitz im Gesamtgericht»"
fassung = "2026-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2006/218/de#art_14"
merkmal = "funktion"

[[eintrag]]
begriff = "Vizepräsident"
formen = ["Vizepräsidentin", "Vizepräsidenten"]
sprache = "de"
regel = "name"
quelle = "BGG (SR 173.110) Art. 14 Abs. 1 lit. b: «den Vizepräsidenten oder die Vizepräsidentin»; BV (SR 101) Art. 176 Abs. 2: «die Vizepräsidentin oder der Vizepräsident des Bundesrates»"
fassung = "2026-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2006/218/de#art_14"
merkmal = "funktion"
notiz = "Die Form «Vizepräsident» belegt BV Art. 176 Abs. 2 (Fassung 03.03.2024, https://www.fedlex.admin.ch/eli/cc/1999/404/de#art_176)."

[[eintrag]]
begriff = "Richter"
formen = ["Richterin"]
sprache = "de"
regel = "name"
quelle = "BGG (SR 173.110) Art. 14 Abs. 4: «durch den Richter oder die Richterin mit dem höchsten Dienstalter»"
fassung = "2026-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2006/218/de#art_14"
merkmal = "funktion"
notiz = "«Richter» ist auch ein Nachname (BFS). Nach einer Anrede gilt es als Funktion; nach einem Vornamen («Hans Richter») als Name."

[[eintrag]]
begriff = "Bundesrichter"
formen = ["Bundesrichtern", "Bundesrichterinnen"]
sprache = "de"
regel = "name"
quelle = "BGG (SR 173.110) Art. 17 Abs. 4 lit. a: «die Zuteilung der nebenamtlichen Bundesrichter und Bundesrichterinnen an die Abteilungen»; Art. 1 Abs. 4: «nebenamtlichen Bundesrichtern und Bundesrichterinnen»"
fassung = "2026-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2006/218/de#art_17"
merkmal = "funktion"
notiz = "Die Einzahl «Bundesrichterin» steht in keinem der geprüften Erlasse und nicht im Duden online (06.11.2026); sie fehlt darum."

[[eintrag]]
begriff = "Gerichtsschreiber"
formen = ["Gerichtsschreiberin", "Gerichtsschreiberinnen"]
sprache = "de"
regel = "name"
quelle = "BGG (SR 173.110) Art. 24 Abs. 1: «Die Gerichtsschreiber und Gerichtsschreiberinnen wirken bei der Instruktion der Fälle … mit»; StPO (SR 312.0) Art. 348 Abs. 2: «Die Gerichtsschreiberin oder der Gerichtsschreiber nimmt mit beratender Stimme teil»"
fassung = "2026-04-01"
url = "https://www.fedlex.admin.ch/eli/cc/2006/218/de#art_24"
merkmal = "funktion"
notiz = "Die Einzahl «Gerichtsschreiberin» belegt StPO Art. 348 Abs. 2 (Fassung 01.04.2025, https://www.fedlex.admin.ch/eli/cc/2010/267/de#art_348)."

[[eintrag]]
