quelle = "Bundesgericht, Regeln für die Anonymisierung der Urteile, Art. 5 Abs. 1: Behörden umfassen «ihre Mitglieder, weitere Gerichtspersonen, Schiedsrichter, Staatsanwälte etc.»"
fassung = "2020-02-13"
url = "https://www.bger.ch/home/juridiction/jurisdiction-recht/anonymisierungsregeln.html"
merkmal = "funktion"

