# Rechtsformzusätze für die Regel «firma» (SPEC 5.2).
#
# Art. 950 Abs. 1 OR: «In der Firma muss die Rechtsform angegeben werden.» Nach Abs. 2 legt
# der Bundesrat die zulässigen Abkürzungen fest. Art. 116a HRegV verlangt die Bezeichnung
# oder ihre Abkürzung in einer Landessprache; Abs. 2 verweist auf Anhang 2 HRegV, Abs. 3 für
# die kollektiven Kapitalanlagen auf das KAG (SR 951.31).
#
# Jede Sprache stammt aus der amtlichen Fassung derselben Sprache. Anhang 2 HRegV führt die
# Liste in allen drei Fassungen gleich. merkmal: «bezeichnung» (ausgeschrieben) oder
# «abkuerzung» (gross = true, Gross-/Kleinschreibung zählt) einer juristischen Person.
# «kollektivgesellschaft» und «kommanditgesellschaft» stehen für die Personengesellschaften,
# ausgeschrieben (gross = false) und abgekürzt (gross = true): Sie sind keine juristischen
# Personen; ihre unbeschränkt haftenden Gesellschafter sind natürliche Personen (Art. 552
# Abs. 1, Art. 568 Abs. 1 und Art. 594 Abs. 2 OR). Die Regel meldet sie wie eine
# Personenangabe (src/regeln/firma.rs). Die KmGK bleibt bei den juristischen Personen: Ihr
# Komplementär muss eine Aktiengesellschaft sein (Art. 98 Abs. 2 KAG).
#
# Nicht aufgenommen: die rätoromanischen Formen aus Anhang 2 (promptscan kennt nur de, fr,
# it) und «L-QIF» (Art. 12 Abs. 2 KAG nennt es, Art. 38, 101 und 111 KAG nicht als
# Abkürzung einer Rechtsform).

