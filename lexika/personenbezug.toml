# Personenbezeichnungen für den Bezug auf eine bestimmte Person in der ersten Person
# («mein Arbeitnehmer», «mon employé», «il mio dipendente»). Ein Eintrag zählt nur mit
# einem Possessivbegleiter der ersten Person unmittelbar davor (src/regeln/kontext.rs).
#
# regel = "personenbezug": Personenbezug ohne Identifikator (SPEC 4.4); wird nie angezeigt.
# regel = "kontext": Klientschaft und Patientinnen und Patienten einer Person mit
#   Berufsgeheimnis. «meine Klientin» zeigt den Geheimnis-Kontext der Rolle in merkmal
#   (SPEC 4.3) und zählt zugleich als Personenbezug. merkmal = "offen": Das Wort sagt
#   nicht, welcher Beruf es braucht (Art. 18a Abs. 3 GwG: Anwältin und Notar; Art. 27
#   lit. c PsyG: Psychotherapie; Art. 4bis Abs. 1 BankG FR/IT: Bank; Art. 398 Abs. 2 OR
#   FR/IT: jeder Auftrag). ROT bleibt die vorsichtige Stufe; die Ausgabe nennt die
#   möglichen Normen und bietet die Rollen zur Auswahl an. Art. 13 BGFA nennt sie erst
#   --role lawyer.
#
# formen: Genus, Numerus und Kasus desselben Worts, keine Synonyme. begriff ist die
# Grundform; die Fundstelle nennt das Wort teils nur in einer Form aus formen
# (Art. 319 Abs. 1 OR: «des Arbeitgebers»; Art. 13 Abs. 1 BGFA FR: «ses clients»).
# Gelesen am 06.11.2026 auf Fedlex (fedlex.data.admin.ch), geltende Fassung; jeder Eintrag
# am Wortlaut des zitierten Artikels nachgeprüft (Grundform oder eine Form aus formen).

# === regel = "kontext" ==================================================================

[[eintrag]]
begriff = "Klient"
formen = ["Klientin", "Klienten", "Klientinnen"]
sprache = "de"
regel = "kontext"
merkmal = "offen"
quelle = "SR 955.0 Art. 18a Abs. 3"
fassung = "2026-10-01"
url = "https://www.fedlex.admin.ch/eli/cc/1998/892_892_892/de#art_18_a"
notiz = "Berufsgeheimnis der Anwältinnen und Anwälte sowie Notarinnen und Notare, aufgehoben «von der Klientin oder vom Klienten». Auch Art. 27 lit. c PsyG (Psychotherapie): «die Rechte ihrer Klientinnen und Klienten». Darum Beruf offen: Art. 321 Ziff. 1 StGB, Art. 320 Ziff. 1 StGB (Behörde) oder Art. 47 BankG, festzulegen mit --role."

[[eintrag]]
begriff = "Klientschaft"
sprache = "de"
regel = "kontext"
merkmal = "offen"
quelle = "SR 935.61 Art. 13 Abs. 1"
fassung = "2025-07-01"
url = "https://www.fedlex.admin.ch/eli/cc/2002/153/de#art_13"
notiz = "«alles, was ihnen infolge ihres Berufes von ihrer Klientschaft anvertraut worden ist». Sammelwort zu «Klient»; Beruf offen wie dort."

[[eintrag]]
begriff = "Mandant"
formen = ["Mandantin", "Mandanten", "Mandantinnen"]
sprache = "de"
regel = "kontext"
merkmal = "offen"
quelle = "Duden online, «Mandant», Bedeutung: «Klient (besonders einer Rechtsanwältin oder eines Rechtsanwalts), Kunde, Auftraggeber»"
fassung = "2026-11-06"
url = "https://www.duden.de/rechtschreibung/Mandant"
notiz = "Kein Bundeserlass braucht das Wort (das OR sagt «Auftraggeber», das BGFA «Klientschaft»); darum das Wörterbuch, abgerufen am 06.11.2026. Auch Treuhand und andere Aufträge: Beruf offen wie «Klient»."

[[eintrag]]
begriff = "Patient"
formen = ["Patientin", "Patienten", "Patientinnen"]
sprache = "de"
regel = "kontext"
merkmal = "doctor"
quelle = "SR 811.11 Art. 40 lit. c"
fassung = "2025-07-01"
url = "https://www.fedlex.admin.ch/eli/cc/2007/537/de#art_40"
notiz = "Berufspflichten der universitären Medizinalberufe: «Sie wahren die Rechte der Patientinnen und Patienten»; lit. f: Berufsgeheimnis. Auch Art. 27 lit. c PsyG nennt Patientinnen und Patienten; Rolle doctor, Norm dieselbe (Art. 321 Ziff. 1 StGB)."

[[eintrag]]
begriff = "client"
formen = ["cliente", "clients", "clientes"]
sprache = "fr"
regel = "kontext"
merkmal = "offen"
quelle = "SR 935.61 Art. 13 Abs. 1"
fassung = "2025-07-01"
url = "https://www.fedlex.admin.ch/eli/cc/2002/153/fr#art_13"
notiz = "«les affaires qui lui sont confiées par ses clients» (Anwältin, Anwalt). Auch die Kundschaft der Bank: «Les prêts et avances qu’une banque accorde à un client» (Art. 4bis Abs. 1 BankG). Beruf offen, festzulegen mit --role; Präzision nicht gemessen (SPEC 8)."

