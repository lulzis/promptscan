# Der französische Artikel «Le» und Amts- und Behördenbezeichnungen danach (Regel name,
# SPEC 5.2).
#
# «Le» steht im BFS-Register als Vorname (161 Nennungen). Am Satzanfang («Le Grand Conseil
# a adopté la loi.») und vor einer Amts- oder Behördenbezeichnung («Le Maire», «Le
# Greffier») ist es der bestimmte Artikel; dort löst es keinen Namen aus. Behörden werden
# nicht markiert (Anonymisierungsregeln des Bundesgerichts, Art. 4 Abs. 1 lit. a).
#
# Die Wortliste markiert keine Stelle im Text. Gelesen wird sie nur unmittelbar nach dem
# Vornamen «Le»: Beginnt dort eine Bezeichnung dieser Liste, gilt «Le» als Artikel.
# Ausserhalb dieser Stellung bleiben die Wörter Namen: «Pierre Maire» ist ein Name.
#
# merkmal:
#   artikel  Artikel, der zugleich ein Vorname des BFS-Registers ist.
#   amt      Amts- oder Behördenbezeichnung aus einem Bundeserlass oder einer
#            Kantonsverfassung (SR 131.2xx), in der französischen Fassung.
#
# «Di» und «Al» stehen auch im Register, aber nicht hier: «Di Maio» ist ein Name.

[[eintrag]]
begriff = "le"
sprache = "fr"
regel = "name"
quelle = "SR 101 Art. 1"
fassung = "2024-03-03"
url = "https://www.fedlex.admin.ch/eli/cc/1999/404/fr#art_1"
merkmal = "artikel"
notiz = "«Le peuple suisse et les cantons de Zurich, …». Bestimmter Artikel; im BFS-Register zugleich Vorname (161 Nennungen, mehrdeutig wegen dieses Artikels und der Gemeinde Le Flon)."

