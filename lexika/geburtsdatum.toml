# Auslöser der Regel «geburtsdatum» (SPEC 5.2) und die Wörter zwischen Auslöser und Datum.
#
# Ein Datum zählt nur, wenn ein Auslöser es einleitet. merkmal:
#   nomen       Bezeichnung des Geburtsdatums; danach das Datum, auch nach «:».
#   partizip    «geboren», «né», «nato»; danach ein Anschlusswort und das Datum.
#   abkuerzung  «geb.»; danach das Datum, auch nach «am».
#   anschluss   Wort direkt vor dem Datum: «am», «le», «il» (vor Vokal «l'»).
#   ort         Präposition vor einem Geburtsort zwischen Partizip und Datum
#               («né à Genève le …», «nato a Lugano il …»).
#   ordinal     Schreibung des ersten Monatstags im Französischen und Italienischen.
#   feldzusatz  Zweiter Feldname nach «/» zwischen Nomen und Datum
#               («Geburtsdatum/Alter: 12.03.1985 (40)»).
#
# Jeder Begriff steht wörtlich in der zitierten Stelle der Fassung derselben Sprache. Die
# Formen sind Flexionsformen (Genus, Numerus) bzw. die Elision des Artikels.
#
# Ausnahme: die Kurzformen der Feldnamen aus Personalblättern, Arztberichten und Formularen
# (Befund technik-6, Entscheid C4) im Abschnitt «Feldnamen ohne eigene Fundstelle». Für
# «Geb.-Datum», «Geb. Datum», «Geb.-Dat.», «date de naiss.», «date naiss.» und «data
# nascita» fand sich weder auf Fedlex noch im Wörterbuch eine Stelle, die die Kurzform
# trägt (gesucht: ZStV, VAwG, AHVV, KVV, notizen/nb/fedlex-geb.txt der Arbeitskopie Paket C).
# Die Einträge zitieren darum das Wörterbuch zum gekürzten Wort und sagen in der Notiz,
# dass die Kurzform selbst ohne Fundstelle ist (Prüferprobleme c-belege-p1, c-erkennung-p7).
# Duden führt «geb.» als «Kurz für geboren», «Dat.» nur als Kürzel für «Dativ». Andere
# Feldnamen («GebDat», «DOB») stehen nicht in der Liste.

# --- Auslöser ---------------------------------------------------------------------------

[[eintrag]]
begriff = "Geburtsdatum"
formen = ["Geburtsdatums", "Geburtsdaten"]
sprache = "de"
regel = "geburtsdatum"
quelle = "SR 211.112.2 Art. 15a Abs. 4bis"
fassung = "2025-06-01"
url = "https://www.fedlex.admin.ch/eli/cc/2004/362/de#art_15_a"
merkmal = "nomen"
notiz = "«… die Angaben Name, Vorname, Geschlecht und Geburtsdatum»."

