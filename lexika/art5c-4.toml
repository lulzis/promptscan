quelle = "SR 143.1 Art. 2 Abs. 2bis"
fassung = "2023-09-01"
url = "https://www.fedlex.admin.ch/eli/cc/2002/441/de#art_2"
notiz = "«Der Datenchip kann ein Gesichtsbild und die Fingerabdrücke der Inhaberin oder des Inhabers enthalten»."

