# Art. 5 Bst. c Ziff. 4 DSG: biometrische Daten, die eine natürliche Person eindeutig
# identifizieren.
#
# Ein Text-Prompt enthält solche Daten kaum je selbst; er nennt sie. Gemeldet wird die
# Nennung. Gewöhnliche Fotografien sind nicht erfasst (BBl 2017 6941, 7020), darum
# fehlen «Foto», «photographie», «fotografia». Gesichtsbilder nennt die Botschaft
# dagegen in allen drei Sprachen als Beispiel biometrischer Daten: «Gesichtsbilder»
# (BBl 2017 7020), «des images faciales» (FF 2017 6641), «un’immagine del viso»
# (FF 2017 6012).

# --- Deutsch ---------------------------------------------------------------

[[eintrag]]
begriff = "biometrische Daten"
formen = ["biometrischen Daten", "biometrischer Daten"]
sprache = "de"
regel = "art5c-4"
quelle = "SR 235.1 Art. 5 Bst. c Ziff. 4"
fassung = "2025-07-07"
url = "https://www.fedlex.admin.ch/eli/cc/2022/491/de#art_5"

[[eintrag]]
begriff = "Fingerabdrücke"
