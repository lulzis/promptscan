# Rust-Standardbibliothek: Bestandteile, die in die Programmdatei gelangen (Ziel
# x86_64-pc-windows-gnu). Von Hand nachgeführt, je Rust-Fassung; examples/drittvermerke.rs
# bricht ab, wenn das Sysroot eine andere Fassung oder eine hier fehlende Bibliothek zeigt.
#
# Welche Crates die Standardbibliothek für dieses Ziel bindet: library/std/Cargo.toml am Tag
#   der Fassung (Abschnitte [dependencies] und die Ziel-Abschnitte, die für
#   x86_64-pc-windows-gnu gelten) und die Bibliotheken im Sysroot
#   (lib/rustlib/x86_64-pc-windows-gnu/lib/*.rlib).
# Fassungen und Prüfsummen: library/Cargo.lock am Tag 1.99.1,
#   https://github.com/rust-lang/rust/blob/1.99.1/library/Cargo.lock
# Lizenzdateien: aus den Paketen auf static.crates.io, SHA-256 gleich wie in library/Cargo.lock
#   (geprüft am 06.11.2026); abgelegt ist nur die Datei der gewählten Lizenz.
# Warum nicht nur COPYRIGHT-library.html aus dem Sysroot: Die Datei der Fassung 1.99.1 führt
#   addr2line, adler2, miniz_oxide und object nicht auf und nennt memchr 2.8.0, das
#   library/Cargo.lock nicht enthält (dort 2.8.3).

rust = "1.99.1"
quelle = "https://github.com/rust-lang/rust/blob/1.99.1/library/Cargo.lock"

[[crate]]
name = "addr2line"
version = "0.27.1"
license = "Apache-2.0 OR MIT"
sha256 = "e567177890eb1617b1f774005b66b26b2377afd138a2ca37aae7d8f0c81429d4"

