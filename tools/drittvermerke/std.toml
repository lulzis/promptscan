# Im Rust-Baum, aber mit eigener Lizenzdatei (library/compiler-builtins/LICENSE.txt und
# library/compiler-builtins/libm/LICENSE.txt am Tag 1.99.1). Die Lizenzangabe von
# compiler_builtins steht in library/compiler-builtins/compiler-builtins/Cargo.toml.
[[im_baum]]
name = "compiler_builtins"
pfad = "library/compiler-builtins"
license = "MIT AND Apache-2.0 WITH LLVM-exception AND (MIT OR Apache-2.0)"
datei = "compiler-builtins/LICENSE.txt"

[[im_baum]]
name = "libm (in compiler_builtins)"
pfad = "library/compiler-builtins/libm"
license = "MIT"
datei = "libm/LICENSE.txt"
